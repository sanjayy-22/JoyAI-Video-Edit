<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 402" role="img" aria-labelledby="t d" font-family="system-ui, -apple-system, Segoe UI, sans-serif">
<title id="t">Estimated resident VRAM per configuration</title>
<desc id="d">Stacked bars of DiT weights, KV and graph buffers, and calibrated other memory for each configuration, against the 23.5 GiB usable on a 24 GB RTX 4090.</desc>
<style>
.viz-root{--surface-1:#fcfcfb;--text-primary:#0b0b0b;--text-secondary:#52514e;--grid:#e4e3df;--series-1:#2a78d6;--series-2:#eb6834;--series-3:#1baf7a;--limit:#0b0b0b}
@media (prefers-color-scheme: dark){.viz-root{--surface-1:#1a1a19;--text-primary:#f0efec;--text-secondary:#c3c2b7;--grid:#3a3936;--series-1:#3987e5;--series-2:#d95926;--series-3:#199e70;--limit:#f0efec}}
text{fill:var(--text-primary);font-size:12px}.muted{fill:var(--text-secondary)}
</style>
<g class="viz-root"><rect width="880" height="402" fill="var(--surface-1)"/>
<text x="20" y="26" font-size="15" font-weight="600">Estimated resident VRAM (GiB)</text>
<text x="20" y="46" class="muted">DiT weights and KV/graph buffers are computed from the code; "VAE, context, activations" is calibrated</text>
<text x="20" y="62" class="muted">from the published RTX 5090 resident number (+/- 1.5 GiB). Transient peaks come on top.</text>
<line x1="300.0" x2="300.0" y1="86" y2="352" stroke="var(--grid)" stroke-width="1"/>
<text x="300.0" y="368" text-anchor="middle" class="muted">0</text>
<line x1="383.1" x2="383.1" y1="86" y2="352" stroke="var(--grid)" stroke-width="1"/>
<text x="383.1" y="368" text-anchor="middle" class="muted">4</text>
<line x1="466.2" x2="466.2" y1="86" y2="352" stroke="var(--grid)" stroke-width="1"/>
<text x="466.2" y="368" text-anchor="middle" class="muted">8</text>
<line x1="549.2" x2="549.2" y1="86" y2="352" stroke="var(--grid)" stroke-width="1"/>
<text x="549.2" y="368" text-anchor="middle" class="muted">12</text>
<line x1="632.3" x2="632.3" y1="86" y2="352" stroke="var(--grid)" stroke-width="1"/>
<text x="632.3" y="368" text-anchor="middle" class="muted">16</text>
<line x1="715.4" x2="715.4" y1="86" y2="352" stroke="var(--grid)" stroke-width="1"/>
<text x="715.4" y="368" text-anchor="middle" class="muted">20</text>
<line x1="798.5" x2="798.5" y1="86" y2="352" stroke="var(--grid)" stroke-width="1"/>
<text x="798.5" y="368" text-anchor="middle" class="muted">24</text>
<text x="290" y="111.0" text-anchor="end">RTX 5090 reference 840x480, no offload</text>
<rect x="300.0" y="92" width="317.9" height="30" rx="0" fill="var(--series-1)"><title>RTX 5090 reference 840x480, no offload
DiT weights (GPU): 15.30 GiB</title></rect>
<rect x="619.9" y="92" width="60.1" height="30" rx="0" fill="var(--series-2)"><title>RTX 5090 reference 840x480, no offload
KV + graph buffers: 2.99 GiB</title></rect>
<rect x="682.0" y="92" width="64.6" height="30" rx="4" fill="var(--series-3)"><title>RTX 5090 reference 840x480, no offload
VAE, context, activations (calibrated): 3.20 GiB</title></rect>
<text x="752.5" y="111.0">21.50</text>
<text x="290" y="159.0" text-anchor="end">4090 balanced 840x480, 8 blocks streamed</text>
<rect x="300.0" y="140" width="271.1" height="30" rx="0" fill="var(--series-1)"><title>4090 balanced 840x480, 8 blocks streamed
DiT weights (GPU): 13.05 GiB</title></rect>
<rect x="573.1" y="140" width="60.1" height="30" rx="0" fill="var(--series-2)"><title>4090 balanced 840x480, 8 blocks streamed
KV + graph buffers: 2.99 GiB</title></rect>
<rect x="635.2" y="140" width="64.6" height="30" rx="4" fill="var(--series-3)"><title>4090 balanced 840x480, 8 blocks streamed
VAE, context, activations (calibrated): 3.20 GiB</title></rect>
<text x="705.8" y="159.0">19.25</text>
<text x="290" y="207.0" text-anchor="end">4090 balanced + RV2V reference image</text>
<rect x="300.0" y="188" width="271.1" height="30" rx="0" fill="var(--series-1)"><title>4090 balanced + RV2V reference image
DiT weights (GPU): 13.05 GiB</title></rect>
<rect x="573.1" y="188" width="86.1" height="30" rx="0" fill="var(--series-2)"><title>4090 balanced + RV2V reference image
KV + graph buffers: 4.24 GiB</title></rect>
<rect x="661.2" y="188" width="64.6" height="30" rx="4" fill="var(--series-3)"><title>4090 balanced + RV2V reference image
VAE, context, activations (calibrated): 3.20 GiB</title></rect>
<text x="731.8" y="207.0">20.50</text>
<text x="290" y="255.0" text-anchor="end">4090 fast 672x384, 4 blocks streamed</text>
<rect x="300.0" y="236" width="302.3" height="30" rx="0" fill="var(--series-1)"><title>4090 fast 672x384, 4 blocks streamed
DiT weights (GPU): 14.55 GiB</title></rect>
<rect x="604.3" y="236" width="37.8" height="30" rx="0" fill="var(--series-2)"><title>4090 fast 672x384, 4 blocks streamed
KV + graph buffers: 1.91 GiB</title></rect>
<rect x="644.0" y="236" width="52.6" height="30" rx="4" fill="var(--series-3)"><title>4090 fast 672x384, 4 blocks streamed
VAE, context, activations (calibrated): 2.63 GiB</title></rect>
<text x="702.6" y="255.0">19.10</text>
<text x="290" y="303.0" text-anchor="end">4090 safe 672x384, 10 blocks streamed</text>
<rect x="300.0" y="284" width="255.6" height="30" rx="0" fill="var(--series-1)"><title>4090 safe 672x384, 10 blocks streamed
DiT weights (GPU): 12.30 GiB</title></rect>
<rect x="557.6" y="284" width="37.8" height="30" rx="0" fill="var(--series-2)"><title>4090 safe 672x384, 10 blocks streamed
KV + graph buffers: 1.91 GiB</title></rect>
<rect x="597.3" y="284" width="52.6" height="30" rx="4" fill="var(--series-3)"><title>4090 safe 672x384, 10 blocks streamed
VAE, context, activations (calibrated): 2.63 GiB</title></rect>
<text x="655.9" y="303.0">16.85</text>
<line x1="788.1" x2="788.1" y1="82" y2="352" stroke="var(--limit)" stroke-width="2" stroke-dasharray="5 4"/>
<text x="784.1" y="78" text-anchor="middle" class="muted">4090 usable ~23.5</text>
<rect x="300" y="382" width="12" height="12" rx="2" fill="var(--series-1)"/>
<text x="318" y="392">DiT weights (GPU)</text>
<rect x="464.4" y="382" width="12" height="12" rx="2" fill="var(--series-2)"/>
<text x="482.4" y="392">KV + graph buffers</text>
<rect x="636.0" y="382" width="12" height="12" rx="2" fill="var(--series-3)"/>
<text x="654.0" y="392">VAE, context, activations (calibrated)</text>
</g></svg>